<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b0c0e">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" href="/icon.svg">
<title>Venice Shell</title>
<style>
  html,body{margin:0;height:100%;background:#0b0c0e;color:#e8e8ea;
    font:15px/1.7 system-ui,-apple-system,"Hiragino Sans",sans-serif}
  main{height:100%;display:flex;flex-direction:column;justify-content:center;
    align-items:center;gap:14px;text-align:center;padding:24px}
  h1{margin:0;font-size:20px;font-weight:600;letter-spacing:.02em}
  p{margin:0;color:#8a8a92;font-size:13px;max-width:32em}
  a{color:#fff;text-decoration:none;border:1px solid #333;border-radius:999px;
    padding:10px 18px;font-size:13px}
  a:hover{background:#1a1a1d}
</style>
</head>
<body>
<main>
  <h1>Venice Shell</h1>
  <p id="msg">セットアップ中…</p>
  <a id="go" href="/chat/agent" hidden>チャットを開く</a>
</main>
<script>
(async function () {
  var msg = document.getElementById('msg');
  var go  = document.getElementById('go');

  if (!('serviceWorker' in navigator)) {
    msg.textContent = 'このブラウザは Service Worker に対応していません。';
    go.hidden = false;
    return;
  }

  try {
    await navigator.serviceWorker.register('/sw.js', { scope: '/' });
    await navigator.serviceWorker.ready;

    // このページが SW の制御下に入るまで待つ（claim で発火する）
    if (!navigator.serviceWorker.controller) {
      await new Promise(function (r) {
        var t = setTimeout(r, 2000);
        navigator.serviceWorker.addEventListener('controllerchange', function () {
          clearTimeout(t); r();
        }, { once: true });
      });
    }

    if (!navigator.serviceWorker.controller) {
      msg.textContent = 'Service Worker が有効になりませんでした。下のリンクを開いてください。';
      go.hidden = false;
      return;
    }

    msg.textContent = '起動中…';
    location.replace('/chat/agent');
  } catch (e) {
    msg.textContent = 'セットアップ失敗: ' + e.message;
    go.hidden = false;
  }
})();
</script>
</body>
</html>
